name: Windows x64 test build

run-name: Windows x64 test build · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source
        run: |
          bun run typecheck
          bun run test -- src/system/windows-shell.test.ts src/system/windows-terminal.test.ts src/system/terminals.test.ts src/web/components/repo-workspace/GitWorkspacePaneToolbar.external-apps.test.tsx
          bun run test -- src/server/terminal/terminal-pty-runtime.test.ts --testNamePattern Windows

      - name: Build Windows packages
        run: bun run build -- --skip-typecheck --skip-rebuild

      - name: Verify Windows x64 artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "release/Goblin-*-x64.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one Windows x64 installer, found $($installers.Count)."
          }
          if (-not (Test-Path "release/win-unpacked/Goblin.exe")) {
            throw "Missing release/win-unpacked/Goblin.exe."
          }
          $hash = Get-FileHash $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($installers[0].Name)" |
            Set-Content "release/SHA256SUMS-windows-x64.txt" -Encoding utf8

      - name: Upload Windows x64 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: goblin-windows-x64-${{ github.run_number }}
          path: |
            release/Goblin-*-x64.exe
            release/win-unpacked/**
            release/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 7
